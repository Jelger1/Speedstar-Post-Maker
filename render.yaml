# Render Blueprint — maakt in één keer een Web Service voor Post Studio.
# Dashboard -> New -> Blueprint -> kies deze repo. Vul daarna de twee
# "sync: false"-variabelen in onder Environment.
services:
  - type: web
    name: post-studio
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: ANTHROPIC_API_KEY
        sync: false          # plak je key in het Render-dashboard, nooit in git
      - key: ACCESS_CODE
        sync: false          # gedeelde code die de tool meestuurt (zelf kiezen)
      - key: AI_MODEL
        value: claude-opus-5
      - key: AI_EFFORT
        value: high
      - key: RATE_LIMIT
        value: "30"
