# Render Blueprint — Web Service voor de Speedstar Post Maker.
# Dashboard -> New -> Blueprint -> kies deze repo. Vul daarna OPENAI_API_KEY
# in onder Environment (sync: false = nooit in git).
services:
  - type: web
    name: speedstar-post-maker
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: OPENAI_API_KEY
        sync: false          # plak je key in het Render-dashboard, nooit in git
      - key: AI_MODEL
        value: gpt-4.1
      - key: RATE_LIMIT
        value: "30"
      - key: ALLOWED_ORIGINS
        value: https://jelger1.github.io
